[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elisium_downloader"
version = "0.1.0"
description = "Desktop front end for yt-dlp (Elisium Downloader)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elisium-downloader = "elisium_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["elisium_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
