[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elisium_downloader"
version = "0.6.0"
description = "Desktop front end for yt-dlp (Elisium)"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["PySide6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
elisium = "elisium_downloader.cli:main"

[tool.setuptools.package-data]
elisium_downloader = ["ui/fonts/*"]

[tool.setuptools.packages.find]
include = ["elisium_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: real network (yt-dlp download); skipped unless ELISIUM_LIVE_TESTS=1",
    "e2e: real yt-dlp + ffmpeg against a local 127.0.0.1 server; skipped if either is missing",
]
